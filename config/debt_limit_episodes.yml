      evidence: "a 'debt issuance suspension period' will begin on Monday, May 20, 2013"
    resolution: 2013-10-17
    resolution_type: suspension
    resolution_source:
      title: "Continuing Appropriations Act, 2014, Pub. L. 113-46"
      issued: 2013-10-17
      url: "https://www.govinfo.gov/content/pkg/PLAW-113publ46/html/PLAW-113publ46.htm"
    notes: "Suspension through February 7, 2014."
