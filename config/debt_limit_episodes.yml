# Debt-limit extraordinary-measures episodes for the descriptive H.4.1 accounts.
#
# extraordinary_measures_start: first day of the debt issuance suspension period
# (or first day Treasury used the measures) stated in the Secretary's letter to
# Congress. resolution: date the suspension or increase that ended the measures
# was signed into law. interim_increase: an enacted increase after which the
# measures continued. Every date cites the primary document that states it.
# Pre-2011 episodes are not registered.
schema_version: debt_limit_episodes_v1
episodes:
  - episode_id: "2011"
    extraordinary_measures_start: 2011-05-16
    extraordinary_measures_source:
      title: "Secretary Geithner letter to Congress on the debt limit (Treasury notice: As US Reaches Debt Limit, Geithner Implements Additional Extraordinary Measures to Allow Continued Funding of Government Obligations)"
      issued: 2011-05-16
      url: "https://home.treasury.gov/as-us-reaches-debt-limit-geithner-implements-additional-extraordinary-measures-to-allow-continued-funding-of-government-obligations"
      evidence: "a 'debt issuance suspension period' will begin today, May 16, 2011"
    resolution: 2011-08-02
    resolution_type: increase
    resolution_source:
      title: "Budget Control Act of 2011, Pub. L. 112-25"
      issued: 2011-08-02
      url: "https://www.govinfo.gov/content/pkg/PLAW-112publ25/html/PLAW-112publ25.htm"
    notes: "The act raised the limit in stages on presidential certification (31 U.S.C. 3101A)."
  - episode_id: "2012-13"
    extraordinary_measures_start: 2012-12-31
    extraordinary_measures_source:
      title: "Secretary Geithner letter to Majority Leader Reid (identical letters to the other congressional leaders)"
      issued: 2012-12-31
      url: "https://home.treasury.gov/system/files/276/Sec-Geithner-Letter-to-Congress-12-31-2012.pdf"
      evidence: "a 'debt issuance suspension period' will begin on Monday, December 31, 2012"
    resolution: 2013-02-04
    resolution_type: suspension
    resolution_source:
      title: "No Budget, No Pay Act of 2013, Pub. L. 113-3"
      issued: 2013-02-04
      url: "https://www.govinfo.gov/content/pkg/PLAW-113publ3/html/PLAW-113publ3.htm"
    notes: "Suspension through May 18, 2013."
