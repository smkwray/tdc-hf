    resolution: 2014-02-15
    resolution_type: suspension
    resolution_source:
      title: "Temporary Debt Limit Extension Act, Pub. L. 113-83"
      issued: 2014-02-15
      url: "https://www.govinfo.gov/content/pkg/PLAW-113publ83/html/PLAW-113publ83.htm"
    notes: "Suspension through March 15, 2015."
  - episode_id: "2015"
